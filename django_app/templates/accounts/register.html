{% extends "base.html" %}
{% block title %}{{ STR.site_name }}: {{ STR.register }}{% endblock %}

{% block content %}
  <h1 class="page-title">{{ STR.register }}</h1>
  <form method="post" style="max-width:380px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-block" type="submit">{{ STR.register }}</button>
  </form>
  <p class="muted" style="margin-top:14px;">{{ STR.login }}? <a href="{% url 'accounts:login' %}">{{ STR.login }}</a></p>
{% endblock %}
